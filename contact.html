<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>যোগাযোগ | পোড়াবাড়ী উচ্চ বিদ্যালয়</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:#000;color:#fff;min-height:100vh;overflow:hidden}
.contact-section{min-height:100vh;width:100%;position:relative;display:flex;justify-content:center;align-items:center;text-align:center;background-image:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.88)),url("image/contact-bg.jpg");background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
.overlay{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(0,0,0,.1),rgba(0,0,0,.7));z-index:1}
.home-btn{position:absolute;top:25px;left:25px;z-index:10;padding:10px 22px;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.7);border-radius:30px;background:rgba(0,0,0,.45);backdrop-filter:blur(5px);transition:.3s}
.home-btn:hover{background:#fff;color:#000}
.content{position:relative;z-index:5;width:90%;max-width:900px;padding:40px 20px}
.content h1{font-size:52px;letter-spacing:8px;margin-bottom:30px;text-transform:uppercase;text-shadow:0 0 10px rgba(255,255,255,.4)}
.typing-box{min-height:120px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap}
#typing{font-size:30px;font-weight:bold;line-height:1.7;letter-spacing:2px;text-shadow:0 0 8px rgba(255,255,255,.7)}
.cursor{display:inline-block;width:3px;height:34px;margin-left:7px;background:#fff;vertical-align:middle;animation:blink .7s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.contact-btn{display:inline-block;margin-top:35px;padding:14px 35px;color:#fff;text-decoration:none;font-size:17px;letter-spacing:2px;border:1px solid #fff;border-radius:30px;background:rgba(0,0,0,.35);transition:.3s}
.contact-btn:hover{background:#fff;color:#000}
@media(max-width:600px){.home-btn{top:18px;left:18px;padding:8px 17px;font-size:14px}.content h1{font-size:32px;letter-spacing:5px}.content{padding:30px 10px}#typing{font-size:20px}.contact-btn{padding:12px 28px;font-size:15px}.contact-section{background-attachment:scroll}}
</style>
</head>
<body>
<section class="contact-section">
<div class="overlay"></div>
<a href="index.html" class="home-btn">← Home</a>
<div class="content">
<h1>Contact</h1>
<div class="typing-box"><div id="typing"></div><span class="cursor"></span></div>
<a href="#" class="contact-btn">Contact Us</a>
</div>
</section>
<script>
const text="Something special coming soon......";
const secondLine="Stay tuned";
const typingElement=document.getElementById("typing");
let index=0,secondIndex=0;
function typeFirstLine(){if(index<text.length){typingElement.innerHTML+=text.charAt(index);index++;setTimeout(typeFirstLine,100)}else setTimeout(typeSecondLine,500)}
function typeSecondLine(){if(secondIndex===0)typingElement.innerHTML+="<br>";if(secondIndex<secondLine.length){typingElement.innerHTML+=secondLine.charAt(secondIndex);secondIndex++;setTimeout(typeSecondLine,100)}}
typeFirstLine();
</script>
</body>
</html>
